---
# Template Semaphore: "Atualizar Cliente"
# Survey vars esperadas: vps_ip (obrigatória), dominio (opcional, só informativo)
#
# ESCOPO ATUAL DESTE TEMPLATE — LEIA ANTES DE EXPANDIR:
# Hoje a única rotina de manutenção segura que existe (não regenera senha,
# não zera credenciais, não rotaciona API key) é aplicar_motor_composicao.sh.
# Não existe ainda, até onde eu revisei, um "atualizador geral" da Synapse
# (git pull de workflows, upgrade de painel, etc.) — não inventei um. Se/
# quando esses procedimentos existirem, adicione novos plays aqui (ou
# templates separados) em vez de apontar pra provisionar_cliente_synapse.sh,
# que continua proibido pra clientes já em produção (ver aviso no
# cabeçalho desse instalador).

- name: "Synapse - registrar VPS de destino"
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Validar parâmetro obrigatório
      ansible.builtin.fail:
        msg: "vps_ip é obrigatório (survey var do template)."
      when: (vps_ip is not defined) or (vps_ip | length == 0)

    - name: Registrar host dinamicamente
      ansible.builtin.add_host:
        name: cliente_alvo
        ansible_host: "{{ vps_ip }}"
        ansible_user: root
        groups: alvo

- name: "Synapse - Aplicar Motor de Composição em {{ vps_ip }} ({{ dominio | default('domínio não informado') }})"
  hosts: alvo
  gather_facts: false
  become: true
  tasks:
    - name: Testar conectividade SSH e privilégio de root
      ansible.builtin.ping:
      register: teste_conectividade

    - name: Falhar cedo e claramente se a conectividade não estiver ok
      ansible.builtin.fail:
        msg: "Não consegui conectar via SSH em {{ vps_ip }} com a chave 'ssh-clientes'."
      when: teste_conectividade is failed

    - name: Confirmar que a VPS já foi provisionada antes (evita rodar isso num host errado)
      ansible.builtin.stat:
        path: /root/synapse_credentials.txt
      register: cred_file

    - name: Abortar se não parecer um cliente Synapse já provisionado
      ansible.builtin.fail:
        msg: "/root/synapse_credentials.txt não existe em {{ vps_ip }} — essa VPS não parece ter sido provisionada pelo provisionar_cliente_synapse.sh. Não vou aplicar o Motor de Composição num host que eu não confirmei ser um cliente Synapse existente."
      when: not cred_file.stat.exists

    - name: Copiar aplicar_motor_composicao.sh pra VPS do cliente
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../aplicar_motor_composicao.sh"
        dest: /root/aplicar_motor_composicao.sh
        mode: "0700"

    - name: Executar aplicar_motor_composicao.sh
      ansible.builtin.command:
        cmd: bash /root/aplicar_motor_composicao.sh
      register: resultado
      changed_when: true
      failed_when: resultado.rc != 0

    - name: Mostrar saída completa
      ansible.builtin.debug:
        var: resultado.stdout_lines

    - name: Confirmar explicitamente sucesso ou falha
      ansible.builtin.fail:
        msg: "Aplicação do Motor de Composição em {{ vps_ip }} FALHOU (código {{ resultado.rc }}). Ver saída acima."
      when: resultado.rc != 0
