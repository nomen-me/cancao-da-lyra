---
# Template Semaphore: "Provisionar Cliente"
# Survey vars esperadas: vps_ip (obrigatória), dominio (obrigatória),
# nome_loja (opcional)
#
# AVISO — LEIA ANTES DE ADICIONAR AO REPO:
# Este playbook assume que o Semaphore passa survey vars como extra-vars
# pro playbook (comportamento padrão documentado do Task Template), e usa
# "add_host" pra registrar a VPS do cliente como host de destino em tempo
# de execução — é a técnica padrão do Ansible pra "host alvo definido em
# runtime por uma variável", e não depende de nenhum comportamento
# Semaphore-específico não confirmado. Ainda assim, teste numa VPS de
# teste antes de confiar nisso em produção (ver checklist de testes).
#
# Este playbook SÓ executa provisionar_cliente_synapse2.sh como já existe
# hoje — não reimplementa o provisionamento (conforme pedido).

- name: "Synapse - registrar VPS de destino"
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Validar parâmetros obrigatórios
      ansible.builtin.fail:
        msg: "vps_ip e dominio são obrigatórios (survey vars do template)."
      when: (vps_ip is not defined) or (dominio is not defined) or (vps_ip | length == 0) or (dominio | length == 0)

    - name: Registrar host dinamicamente
      ansible.builtin.add_host:
        name: cliente_alvo
        ansible_host: "{{ vps_ip }}"
        ansible_user: root
        groups: alvo

- name: "Synapse - Provisionar Cliente Novo em {{ vps_ip }}"
  hosts: alvo
  gather_facts: false
  become: true
  vars:
    nome_loja_efetivo: "{{ nome_loja | default(dominio) }}"
  environment:
    LYRA_CENTRAL_URL: "{{ LYRA_CENTRAL_URL }}"
    LYRA_ADMIN_API_KEY: "{{ LYRA_ADMIN_API_KEY }}"
    GITHUB_TOKEN: "{{ GITHUB_TOKEN }}"
  tasks:
    - name: Testar conectividade SSH e privilégio de root
      ansible.builtin.ping:
      register: teste_conectividade

    - name: Falhar cedo e claramente se a conectividade não estiver ok
      ansible.builtin.fail:
        msg: "Não consegui conectar via SSH em {{ vps_ip }} com a chave 'ssh-clientes'. Confirme que a chave pública está em /root/.ssh/authorized_keys nessa VPS antes de continuar."
      when: teste_conectividade is failed

    - name: Copiar o instalador (provisionar_cliente_synapse2.sh) pra VPS do cliente
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../provisionar_cliente_synapse2.sh"
        dest: /root/provisionar_cliente_synapse2.sh
        mode: "0700"

    - name: Executar o provisionamento (pode levar vários minutos)
      ansible.builtin.command:
        cmd: >
          bash /root/provisionar_cliente_synapse2.sh
          "{{ dominio }}" "{{ nome_loja_efetivo }}"
      register: resultado
      changed_when: true
      failed_when: resultado.rc != 0

    - name: Mostrar saída completa do provisionamento
      ansible.builtin.debug:
        var: resultado.stdout_lines

    - name: Confirmar explicitamente sucesso ou falha (não silencioso)
      ansible.builtin.fail:
        msg: "Provisionamento de {{ dominio }} FALHOU (código {{ resultado.rc }}). Ver saída acima antes de considerar o cliente pronto."
      when: resultado.rc != 0

# =============================================================================
# Registro automático em inventory/clientes_ativos.yml — só roda se o
# provisionamento acima teve sucesso. Sem isso, o cliente novo nunca
# entraria na rotação de backup/manutenção sem edição manual do inventário,
# que é exatamente o trabalho que este pacote existe pra eliminar.
#
# LIMITAÇÃO ASSUMIDA E DECLARADA: esta etapa reescreve o YAML inteiro via
# PyYAML (carrega, insere o host se ainda não existir, salva) — comentários
# manuais no arquivo não sobrevivem a partir daqui (ver aviso no topo do
# próprio inventory/clientes_ativos.yml). Não implementei travamento contra
# duas execuções simultâneas do template "Provisionar Cliente" tentando
# commitar ao mesmo tempo (condição de corrida real se dois provisionamentos
# terminarem no mesmo instante) — o "git push --ff-only" abaixo detecta o
# conflito e RECUSA sobrescrever, mas não resolve sozinho; nesse caso raro,
# rode o registro de novo manualmente (fica pendente, não corrompe nada).
# =============================================================================
- name: "Synapse - Registrar {{ dominio }} em inventory/clientes_ativos.yml"
  hosts: localhost
  gather_facts: true
  vars:
    repo_tmpdir: "/tmp/synapse_inv_sync_{{ ansible_date_time.epoch }}"
  tasks:
    - name: Clonar o repositório pra atualizar o inventário
      ansible.builtin.git:
        repo: "https://x-access-token:{{ GITHUB_TOKEN }}@github.com/nomen-me/synapse.git"
        dest: "{{ repo_tmpdir }}"
        version: main
        depth: 1
      no_log: true  # a URL de clone contém o token — nunca deixar isso no log

    - name: Inserir/atualizar o host no grupo clientes_ativos (idempotente)
      ansible.builtin.command:
        cmd: >
          python3 {{ playbook_dir }}/../scripts/registrar_cliente_inventario.py
          {{ repo_tmpdir }}/inventory/clientes_ativos.yml
          {{ dominio }} {{ vps_ip }} "{{ nome_loja_efetivo }}"
          {{ ansible_date_time.iso8601 | default('desconhecido') }}
      register: resultado_insercao
      changed_when: "'ADICIONADO' in resultado_insercao.stdout"

    - name: Fazer commit só se o host foi realmente adicionado/alterado
      ansible.builtin.command:
        cmd: "{{ item }}"
        chdir: "{{ repo_tmpdir }}"
      loop:
        - "git config user.email semaphore@nomen.me"
        - "git config user.name 'Semaphore (registro automático de cliente)'"
        - "git add inventory/clientes_ativos.yml"
        - "git commit -m 'chore(inventory): adiciona {{ dominio }} em clientes_ativos'"
      when: "'ADICIONADO' in resultado_insercao.stdout"
      changed_when: true

    - name: "git fetch antes de empurrar (checar divergência)"
      ansible.builtin.command:
        cmd: git fetch origin main
        chdir: "{{ repo_tmpdir }}"
      when: "'ADICIONADO' in resultado_insercao.stdout"
      changed_when: false

    - name: "Push só como fast-forward — nunca força, nunca resolve conflito sozinho"
      ansible.builtin.command:
        cmd: git push --ff-only origin HEAD:main
        chdir: "{{ repo_tmpdir }}"
      register: push_inventario
      when: "'ADICIONADO' in resultado_insercao.stdout"
      changed_when: true
      failed_when: false

    - name: Avisar se o push do inventário falhou (não bloqueia o provisionamento, que já terminou)
      ansible.builtin.debug:
        msg: "ATENÇÃO: o cliente {{ dominio }} foi provisionado com sucesso, mas o registro automático em clientes_ativos.yml NÃO chegou ao GitHub (push recusado — branch pode ter divergido). Adicione manualmente ou rode este template de novo pra tentar o registro."
      when: "'ADICIONADO' in resultado_insercao.stdout and push_inventario.rc != 0"

    - name: Limpar o clone temporário
      ansible.builtin.file:
        path: "{{ repo_tmpdir }}"
        state: absent
