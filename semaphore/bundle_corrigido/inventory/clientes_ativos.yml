# inventory/clientes_ativos.yml
#
# Este arquivo é gerenciado automaticamente pelo template "Provisionar
# Cliente" (playbooks/provisionar_cliente.yml): ao final de cada
# provisionamento bem-sucedido, o próprio playbook adiciona o cliente aqui
# e dá commit/push. Você não precisa editar isso na mão pra um cliente
# novo entrar na rotação de backup/manutenção.
#
# AVISO IMPORTANTE: a partir do primeiro commit automático, este arquivo
# passa a ser reescrito via parser YAML (PyYAML) pelo playbook — comentários
# e formatação manual que você adicionar aqui depois de editar direto podem
# não sobreviver ao próximo commit automático. Se quiser anotações fixas
# por cliente, use os campos de host (ex: "obs:") em vez de comentários "#".
#
# clientes_ativos: recebem provisionamento, atualização e backup.
# clientes_inativos: existem no inventário mas NÃO são alvo de nenhum
#   template — mova um host pra cá (na UI do Semaphore, editando o
#   inventory, ou editando este arquivo e commitando) pra tirá-lo da
#   rotação sem apagar o registro dele.
all:
  children:
    clientes_ativos:
      hosts: {}
    clientes_inativos:
      hosts: {}
